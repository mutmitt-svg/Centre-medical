# ---------------------------------------------------------------------------
# Publication automatique sur GitHub Pages.
#
# À chaque poussée sur la branche principale, le code est compilé puis le
# contenu de dist/ est publié. GitHub Pages ne sait pas compiler du JSX : il
# faut donc lui livrer le résultat de la compilation, jamais les sources.
#
# Réglage à faire une seule fois dans le dépôt :
#   Settings > Pages > Build and deployment > Source : GitHub Actions
#
# Variables de liaison à la base, à créer dans
#   Settings > Secrets and variables > Actions > Variables :
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_STRUCTURE_NOM,
#   VITE_STRUCTURE_CODE
# Sans elles, l'application se publie en mode découverte avec le jeu de
# démonstration, ce qui convient pour une présentation.
# ---------------------------------------------------------------------------
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SCHEMA: cs
          VITE_STRUCTURE_NOM: ${{ vars.VITE_STRUCTURE_NOM }}
          VITE_STRUCTURE_CODE: ${{ vars.VITE_STRUCTURE_CODE }}
        run: npm run build

      - name: Empêcher le traitement Jekyll
        run: touch dist/.nojekyll

      - name: Préparer la publication
        uses: actions/configure-pages@v5

      - name: Téléverser le résultat
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
